server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_types text/html text/plain text/css text/xml application/xml application/javascript image/svg+xml application/json application/ld+json;
  gzip_min_length 1024;

  # imagens, figuras e fontes locais: um ano de cache; html e código: revalida sempre
  location ~* \.(jpg|jpeg|png|webp|svg|ico|mp4|woff2?)$ { expires 365d; add_header Cache-Control "public, immutable"; }
  # o mime.types do nginx não tem .mjs: sem isto o navegador recusa os módulos e nenhuma animação roda
  location ~* \.mjs$ {
    types { }
    default_type application/javascript;
    add_header Cache-Control "no-cache";
  }
  location ~* \.(js|css|json)$ { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
}
